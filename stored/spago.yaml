# What Reef's values look like where they are kept. First: a calibration
# table as it is stored in Amphora, described once with Hawser. Apart from
# reef itself so that reef stays light (it builds for the BEAM with the
# purerl set alone); a consumer that reads or writes stored tables takes
# this as well.
package:
  name: reef-stored
  dependencies:
    - arrays
    - hawser
    - maybe
    - numbers
    - prelude
    - reef
  test:
    main: Test.Stored
    dependencies:
      - console
      - effect
      - exceptions
