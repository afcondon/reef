# Calibration tables as they are kept in Amphora (described once with
# Hawser), and the judgement of a calibration sweep. Apart from
# reef itself so that reef stays light (it builds for the BEAM with the
# purerl set alone); a consumer that reads or writes stored tables takes
# this as well.
package:
  name: reef-stored
  dependencies:
    - arrays
    - foldable-traversable
    - hawser
    - integers
    - maybe
    - numbers
    - prelude
    - reef
    - tuples
  test:
    main: Test.Stored
    dependencies:
      - console
      - effect
      - exceptions
