package:
  name: reef
  description: >
    Reef — a portable package of virtual-module engines for the live rig. Pure
    sequencer cores (Odonus first; Balistes, Selene to follow) plus the wire
    protocol to drive them, as one source of truth compiled to both the
    Triggerfish JS frontend and the purerl-tidal Erlang engine. Builds on
    harmonia (the theory layer).
  dependencies:
    - prelude
    - arrays
    - foldable-traversable
    - integers
    - maybe
    - harmonia
    - simple-json   # wire codec; the only JSON codec in the purerl set, so the
                    # same encode/decode compiles to both Triggerfish (JS) and the BEAM
    - foreign
    - either
    - strings
    - numbers
  test:
    main: Test.Main
    dependencies:
      - effect
      - console
      - assert
workspace:
  extraPackages:
    harmonia: 0.2.0
  packageSet:
    registry: 77.13.1
